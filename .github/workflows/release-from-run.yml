name: Publish release from a build run

# Started automatically by the last step of every successful "Build Windows installer" run, and can
# also be started by hand for an older run. It tags the exact commit that run built as v<version> (the version in
# src-tauri/tauri.conf.json) and attaches the installer to a GitHub release with that tag.
# If the release already exists, only its installer is replaced.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a successful 'Build Windows installer' run (the number in its URL)"
        required: true
        default: "43704657397"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Find the commit that run built
        id: run
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq .head_sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Check out that exact commit so the version we tag is the version that was built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}

      - name: Download the installer from that run
        uses: actions/download-artifact@v4
        with:
          name: Anilili-Windows-Installer
          path: installer
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      # Uses the repo secret RELEASE_TOKEN if you add one (a personal access token with Contents and
      # Workflows write access); otherwise the built-in token. GitHub can refuse the built-in token
      # when the tagged commit itself changed files under .github/workflows.
      - name: Create or update the release
        env:
          SHA: ${{ steps.run.outputs.sha }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          ls -la installer
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; replacing its installer."
            gh release upload "$tag" installer/*.exe --clobber
          else
            gh release create "$tag" installer/*.exe \
              --target "$SHA" \
              --title "Anilili Desktop $version (Windows installer)" \
              --notes "Unsigned Windows installer for Anilili Desktop $version, built by GitHub Actions run $RUN_ID from commit ${SHA:0:7}. Windows SmartScreen may warn: click More info, then Run anyway."
          fi
          echo "Release $tag: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
